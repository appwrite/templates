<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscriptions with Dodo Payments</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@^5.3.0/index.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@^3.17.4/dist/cdn.min.js"
    ></script>

    <style>
      :root {
        color-scheme: dark;
        --background: #19191c;
        --foreground: #fafafa;
        --card: #1d1d21;
        --border: #2d2d31;
        --input: #2d2d31;
        --accent: #2d2d31;
        --muted-foreground: #9f9fa9;
        --ring: #54545d;
        --brand: #fd366e;
        --brand-foreground: #fff;
        --success: #00c758;
        --radius: 0.625rem;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --background: #fff;
          --foreground: #09090b;
          --card: #fff;
          --border: #e7e7ea;
          --input: #e7e7ea;
          --accent: #f4f4f5;
          --muted-foreground: #71717b;
          --ring: #dddde0;
          --success: #00a544;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family:
          'Inter Variable', Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      [x-cloak] {
        display: none !important;
      }

      .page {
        max-width: 44rem;
        margin: 0 auto;
        padding: 4rem 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 6vw, 3.25rem);
        font-weight: 450;
        line-height: 1.04;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      .text-gradient-brand {
        background-image: linear-gradient(
          145deg,
          var(--brand) 0%,
          var(--brand) 18%,
          var(--foreground) 46%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .cursor {
        color: var(--brand);
      }

      .lede {
        margin: 1rem 0 0;
        max-width: 36rem;
        color: var(--muted-foreground);
        font-size: 16px;
      }

      .card {
        margin-top: 2.5rem;
        padding: 1.5rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }

      .between {
        justify-content: space-between;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
      }

      .muted {
        color: var(--muted-foreground);
      }

      hr {
        width: 100%;
        margin: 0.5rem 0;
        border: 0;
        border-top: 1px solid var(--border);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        height: 2.5rem;
        padding: 0 1rem;
        border: 1px solid transparent;
        border-radius: calc(var(--radius) - 2px);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition:
          opacity 0.15s,
          background-color 0.15s,
          color 0.15s;
      }

      .btn:focus-visible,
      .input:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .btn-primary {
        background: var(--brand);
        color: var(--brand-foreground);
      }

      .btn-primary:hover {
        opacity: 0.9;
      }

      .btn-secondary {
        background: transparent;
        border-color: var(--input);
        color: var(--muted-foreground);
      }

      .btn-secondary:hover {
        background: var(--accent);
        color: var(--foreground);
      }

      .btn-icon {
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
      }

      .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .input {
        flex: 1 1 12rem;
        height: 2.5rem;
        padding: 0 0.75rem;
        background: transparent;
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 2px);
        color: var(--foreground);
        font: inherit;
      }

      .input::placeholder {
        color: var(--muted-foreground);
      }

      .list {
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 2px);
      }

      .list-item {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }

      .list-item + .list-item {
        border-top: 1px solid var(--border);
      }

      .list-item .icon {
        color: var(--success);
      }

      .list-item time {
        margin-left: auto;
        color: var(--muted-foreground);
        font-size: 13px;
      }

      code {
        padding: 0.125rem 0.375rem;
        background: var(--accent);
        border-radius: 0.375rem;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
      }

      .alert {
        display: flex;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        background: var(--accent);
        border-radius: calc(var(--radius) - 2px);
      }

      .alert .icon {
        margin-top: 2px;
        color: var(--muted-foreground);
      }

      .alert-title {
        font-weight: 500;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
      }

      .status::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted-foreground);
      }

      .status.is-active::before {
        background: var(--success);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1>
          <span class="text-gradient-brand"
            >Subscriptions with Dodo Payments</span
          ><span class="cursor">_</span>
        </h1>
        <p class="lede">
          Use this demo to create a Dodo Payments subscription. While the
          subscription is active, the user has a <code>subscriber</code> label.
          You can use the label to give permissions to subscribers only.
        </p>
      </header>

      <section class="card" x-data x-cloak>
        <template x-if="$store.auth.user === null">
          <p class="muted">Loading..</p>
        </template>

        <template x-if="$store.auth.user === false">
          <div class="stack">
            <h2>Subscription status</h2>
            <p class="muted">Only registered users can create subscriptions.</p>
            <div>
              <button
                x-on:click="$store.auth.register()"
                class="btn btn-primary"
              >
                Register as anonymous
              </button>
            </div>
          </div>
        </template>

        <template x-if="$store.auth.user">
          <div class="stack">
            <div class="row between">
              <h2>Subscription status</h2>
              <button
                class="btn btn-secondary btn-icon"
                aria-label="Refresh subscription status"
                x-on:click="$store.auth.init()"
              >
                <svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
                  />
                  <path d="M3 3v5h5" />
                  <path
                    d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"
                  />
                  <path d="M16 16h5v5" />
                </svg>
              </button>
            </div>

            <template x-if="$store.auth.user.labels.includes('subscriber')">
              <div>
                <span class="status is-active">Subscribed</span>
              </div>
            </template>
            <template x-if="!$store.auth.user.labels.includes('subscriber')">
              <div class="stack">
                <div>
                  <span class="status">Not subscribed</span>
                </div>
                <div class="alert">
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4" />
                    <path d="M12 8h.01" />
                  </svg>
                  <div>
                    <p class="alert-title">
                      Payment processing can take some time.
                    </p>
                    <p class="muted">
                      If you paid, wait a few seconds and refresh the status.
                    </p>
                  </div>
                </div>

                <hr />

                <h2>Subscribe</h2>
                <div class="row">
                  <input
                    type="text"
                    class="input name"
                    placeholder="Full name (optional)"
                    aria-label="Full name"
                  />
                  <input
                    type="email"
                    class="input email"
                    placeholder="Email address (optional)"
                    aria-label="Email address"
                  />
                </div>
              </div>
            </template>

            <div class="row" x-data="{ busy: false }">
              <template x-if="!$store.auth.user.labels.includes('subscriber')">
                <button
                  x-on:click="busy = true; subscribe().finally(() => (busy = false))"
                  x-bind:disabled="busy"
                  class="btn btn-primary"
                  x-text="busy ? 'Creating checkout..' : 'Subscribe with Dodo Payments'"
                ></button>
              </template>
              <button
                x-on:click="$store.auth.signOut()"
                class="btn btn-secondary"
              >
                Sign out
              </button>
            </div>
          </div>
        </template>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@^28.1.0/dist/iife/sdk.js"></script>
    <script>
      const { Client, Account, Functions, ExecutionMethod } = Appwrite;
      const client = new Client()
        .setEndpoint('{{APPWRITE_FUNCTION_API_ENDPOINT}}')
        .setProject('{{APPWRITE_FUNCTION_PROJECT_ID}}');
      const account = new Account(client);
      const functions = new Functions(client);

      async function subscribe() {
        // Dodo Payments prefills the checkout with these when they're set.
        const email = document.querySelector('.email').value || undefined;
        const name = document.querySelector('.name').value || undefined;
        // Dodo Payments appends the subscription status to this URL, so drop
        // any query string left over from a previous checkout.
        const returnUrl = window.location.origin + window.location.pathname;

        const execution = await functions.createExecution({
          functionId: '{{APPWRITE_FUNCTION_ID}}',
          body: JSON.stringify({
            successUrl: returnUrl,
            failureUrl: returnUrl,
            email,
            name,
          }),
          async: false,
          xpath: '/subscribe',
          method: ExecutionMethod.POST,
          headers: {
            'Content-Type': 'application/json',
          },
        });
        const url =
          execution.responseHeaders.find(
            (header) => header.name === 'location'
          ) ?? {};
        window.location.replace(url.value ?? '/');
      }

      document.addEventListener('alpine:init', async () => {
        Alpine.store('auth', {
          user: null, // null = loading, false = not logged in, object = logged in

          async init() {
            try {
              this.user = await account.get();
            } catch (err) {
              console.warn(err);
              this.user = false;
            }
          },

          async register() {
            await account.createAnonymousSession();
            this.user = await account.get();
          },
          async signOut() {
            await account.deleteSession({ sessionId: 'current' });
            this.user = false;
          },
        });
      });
    </script>
  </body>
</html>
