name: Dependency audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC — catch newly published advisories without a code change
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  OSV_SCANNER_VERSION: "v2.3.1"

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm templates
        run: |
          failed=0
          for dir in node/*/ node-typescript/*/; do
            [ -f "${dir}package-lock.json" ] || continue
            echo "::group::${dir%/}"
            npm audit --prefix "$dir" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  bun:
    name: bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Audit bun templates
        run: |
          failed=0
          for dir in bun/*/; do
            [ -f "${dir}package.json" ] || continue
            [ -f "${dir}bun.lock" ] || [ -f "${dir}bun.lockb" ] || continue
            echo "::group::${dir%/}"
            (cd "$dir" && bun audit) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  php:
    name: php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Audit PHP templates
        run: |
          failed=0
          for dir in php/*/; do
            [ -f "${dir}composer.json" ] || continue
            echo "::group::${dir%/}"
            (
              cd "$dir"
              composer update --no-install --no-interaction
              composer audit --locked --no-interaction
            ) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python templates
        run: |
          failed=0
          for req in python/*/requirements.txt python-ml/*/requirements.txt; do
            [ -f "$req" ] || continue
            echo "::group::${req%/requirements.txt}"
            pip-audit -r "$req" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  ruby:
    name: ruby
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler: latest
      - name: Install bundler-audit
        run: gem install bundler-audit
      - name: Audit Ruby templates
        run: |
          failed=0
          for dir in ruby/*/; do
            [ -f "${dir}Gemfile" ] || continue
            echo "::group::${dir%/}"
            (
              cd "$dir"
              bundle lock
              bundle-audit update
              bundle-audit check --no-update
            ) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  dart:
    name: dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Install OSV Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@${{ env.OSV_SCANNER_VERSION }}
      - name: Audit Dart templates
        run: |
          failed=0
          for dir in dart/*/; do
            [ -f "${dir}pubspec.yaml" ] || continue
            echo "::group::${dir%/}"
            (
              cd "$dir"
              dart pub get
              osv-scanner scan source --lockfile=pubspec.lock
            ) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Audit Go templates
        run: |
          failed=0
          for dir in go/*/; do
            [ -f "${dir}go.mod" ] || continue
            echo "::group::${dir%/}"
            (cd "$dir" && govulncheck ./...) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust templates
        run: |
          failed=0
          for dir in rust/*/; do
            [ -f "${dir}Cargo.toml" ] || continue
            echo "::group::${dir%/}"
            (cd "$dir" && cargo audit) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Audit .NET templates
        run: |
          failed=0
          for dir in dotnet/*/; do
            csproj=$(find "$dir" -maxdepth 1 -name '*.csproj' | head -1)
            [ -n "$csproj" ] || continue
            echo "::group::${dir%/}"
            (
              cd "$dir"
              dotnet restore
              out=$(dotnet list package --vulnerable --include-transitive)
              echo "$out"
              if echo "$out" | grep -qiE 'has the following vulnerable packages|Severity'; then
                exit 1
              fi
            ) || failed=1
            echo "::endgroup::"
          done
          exit $failed
