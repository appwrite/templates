version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/node/*"
      - "/node-typescript/*"
      - "/.github/workflows/markdown-table-workflow"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      npm-version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
