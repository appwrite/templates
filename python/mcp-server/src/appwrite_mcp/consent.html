<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorize access</title>
<style>
  :root { --bg: #f4f4f7; --card: #fff; --text: #19191c; --muted: #6c6c71; --border: #e4e4e7; --accent: #fd366e; --accent-text: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1d1d21; --text: #ededf0; --muted: #97979b; --border: #2d2d31; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-size: 13px; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); font: inherit; }
  button { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-weight: 500; cursor: pointer; margin-top: 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  ul { list-style: none; margin: 0 0 8px; padding: 0; border: 1px solid var(--border); border-radius: 8px; }
  li { padding: 10px 12px; border-top: 1px solid var(--border); font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  li:first-child { border-top: 0; }
  .meta { font-size: 13px; color: var(--muted); margin: 12px 0 0; word-break: break-all; }
  .error { color: #e5484d; font-size: 13px; margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login" hidden>
    <h1>Sign in to continue</h1>
    <p>An app wants to connect to your account.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>

  <section id="consent" hidden>
    <h1>Authorize <span id="client"></span></h1>
    <p>Signed in as <strong id="user"></strong>. This app is asking for:</p>
    <ul id="scopes"></ul>
    <p class="meta" id="resource"></p>
    <button class="primary" id="approve">Allow</button>
    <button id="reject">Deny</button>
  </section>

  <p class="error" id="error" hidden></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/appwrite@28.1.0/dist/iife/sdk.js"></script>
<script>
  const endpoint = '__APPWRITE_ENDPOINT__';
  const project = '__APPWRITE_PROJECT__';
  const client = new Appwrite.Client().setEndpoint(endpoint).setProject(project);
  const account = new Appwrite.Account(client);
  const params = new URLSearchParams(location.search);
  const oauth2 = (path) => new URL(`${endpoint}/oauth2/${project}${path}`);
  const json = { 'content-type': 'application/json', accept: 'application/json' };
  const $ = (id) => document.getElementById(id);

  function fail(error) {
    $('error').textContent = error.message || String(error);
    $('error').hidden = false;
  }

  async function grant() {
    if (params.get('grant_id')) {
      return { grantId: params.get('grant_id'), redirectUrl: '' };
    }
    const query = {};
    for (const key of ['client_id', 'redirect_uri', 'response_type', 'scope', 'state', 'nonce', 'code_challenge', 'code_challenge_method', 'prompt', 'max_age', 'authorization_details', 'request_uri']) {
      if (params.get(key)) query[key] = params.get(key);
    }
    const resources = params.getAll('resource');
    const url = oauth2('/authorize');
    for (const [key, value] of Object.entries(query)) url.searchParams.set(key, value);
    for (const value of resources) url.searchParams.append('resource', value);
    return client.call('get', url, json);
  }

  async function showConsent(user) {
    const { grantId, redirectUrl } = await grant();
    if (redirectUrl) {
      location.assign(redirectUrl);
      return;
    }
    const details = await client.call('get', oauth2(`/grants/${grantId}`), json);
    $('client').textContent = new URL(details.redirectUri).host;
    $('user').textContent = user.email;
    $('scopes').replaceChildren(...details.scopes.map((scope) => Object.assign(document.createElement('li'), { textContent: scope })));
    $('resource').textContent = details.resources.length ? `For: ${details.resources.join(', ')}` : '';
    $('login').hidden = true;
    $('consent').hidden = false;

    for (const [button, path] of [['approve', '/approve'], ['reject', '/reject']]) {
      $(button).onclick = async () => {
        try {
          const response = await client.call('post', oauth2(path), json, { grant_id: grantId });
          location.assign(response.redirectUrl);
        } catch (error) {
          fail(error);
        }
      };
    }
  }

  $('login-form').onsubmit = async (event) => {
    event.preventDefault();
    try {
      await account.createEmailPasswordSession({ email: $('email').value, password: $('password').value });
      await showConsent(await account.get());
    } catch (error) {
      fail(error);
    }
  };

  account.get().then(showConsent, () => { $('login').hidden = false; }).catch(fail);
</script>
</body>
</html>
